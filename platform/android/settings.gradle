pluginManagement {
    def packageConfig = new groovy.json.JsonSlurper().parse(
        new File(settingsDir, 'package.json')
    )
    plugins {
        id 'com.android.application' version packageConfig.agpVersion
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'crashbash-android'
include ':app'
